<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PFMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width:480px;">
  <div class="card shadow-sm">
    <div class="card-body">
      <h3 class="mb-3">Login</h3>
      {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
      <form method="post">
        <div class="mb-3"><label>Email</label><input class="form-control" name="email" type="email" required></div>
        <div class="mb-3"><label>Password</label><input class="form-control" name="password" type="password" required></div>
        <button class="btn btn-primary w-100">Login</button>
      </form>
      <p class="mt-3">New user? <a href="{{ url_for('auth.register') }}">Register here</a></p>
    </div>
  </div>
</div>
</body>
</html>
