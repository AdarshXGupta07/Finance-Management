<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PFMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-page">
  <main class="auth-shell" role="main">
    <div class="card auth-card">
      <div class="auth-accent"></div>
      <div class="card-body">
        <h3 class="auth-title">Welcome back</h3>
        <p class="auth-subtitle">Login to continue managing your finances.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endwith %}

        <form class="auth-form" method="post">
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" placeholder="you@example.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" placeholder="Enter password" required>
          </div>
          <button class="btn btn-primary auth-btn w-100" type="submit">Login</button>
        </form>

        <p class="auth-switch">New user? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
      </div>
    </div>
  </main>
</body>
</html>
